<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="MCPVP Check shows whether mcpvp.com is open to all or whitelist-only by reading the server MOTD.">
    <title>MCPVP Check</title>
    <link rel="preconnect" href="https://api.mcstatus.io">
    <link rel="preconnect" href="https://api.mcsrvstat.us">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MCPVP Check">
    <link rel="stylesheet" href="app.css?v=4">
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <h1 id="page-title">MCPVP Check</h1>
        </div>

        <button class="server-chip" id="copy-address" type="button" aria-label="Copy server address">
          <span class="pulse" aria-hidden="true"></span>
          <span id="server-address">mcpvp.com</span>
        </button>
      </section>

      <section class="status-card unknown" id="status-card" aria-live="polite">
        <div class="status-main">
          <div class="status-icon" id="status-icon" aria-hidden="true">?</div>
          <div>
            <p class="status-kicker" id="status-kicker">Checking MOTD</p>
            <h2 id="status-title">Loading...</h2>
            <p id="status-detail">Contacting the Minecraft status API.</p>
          </div>
        </div>

        <button class="refresh-button" id="refresh-button" type="button">
          <span aria-hidden="true">↻</span>
          Refresh
        </button>
      </section>

      <section class="details-grid" aria-label="Server details">
        <article class="detail-box">
          <span class="label">MOTD</span>
          <p id="motd">Waiting for server message...</p>
        </article>
        <article class="detail-box">
          <span class="label">Players</span>
          <p id="players">-- / --</p>
        </article>
        <article class="detail-box">
          <span class="label">Version</span>
          <p id="version">Unknown</p>
        </article>
        <article class="detail-box">
          <span class="label">Last Checked (EST NYC)</span>
          <p id="checked-at">--</p>
        </article>
      </section>

      <details class="history-panel">
        <summary>Whitelist off history</summary>
        <div id="history-list" class="history-list">Loading history...</div>
      </details>

    </main>

    <script>
      const checkerScript = document.createElement("script");
      checkerScript.src = `script.js?v=${Date.now()}`;
      document.body.append(checkerScript);
    </script>
  </body>
</html>
